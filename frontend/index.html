<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="EduIA: acompanhamento de risco de dificuldade de aprendizagem por turma.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%231d4e89%22/%3E%3Cg%20fill%3D%22%23fffdf8%22%3E%3Crect%20x%3D%228%22%20y%3D%227.5%22%20width%3D%223.6%22%20height%3D%2217%22%20rx%3D%221%22/%3E%3Crect%20x%3D%228%22%20y%3D%227.5%22%20width%3D%2216.5%22%20height%3D%223.6%22%20rx%3D%221%22/%3E%3Crect%20x%3D%228%22%20y%3D%2214.2%22%20width%3D%2212%22%20height%3D%223.6%22%20rx%3D%221%22/%3E%3Crect%20x%3D%228%22%20y%3D%2220.9%22%20width%3D%227.5%22%20height%3D%223.6%22%20rx%3D%221%22/%3E%3C/g%3E%3Crect%20x%3D%2218.5%22%20y%3D%2220.9%22%20width%3D%223.6%22%20height%3D%223.6%22%20rx%3D%221.8%22%20fill%3D%22%23e0a43a%22/%3E%3C/svg%3E">
<title>EduIA · Acompanhamento de turmas</title>
<link rel="stylesheet" href="css/style.css">
<script>
  // Aplica o tema antes da pintura para não piscar.
  (function(){try{var c=JSON.parse(localStorage.getItem('eduia_cfg')||'{}');var t=c.tema||'sistema';
  if(t==='sistema')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
</head>
<body>
<a class="skip" href="#conteudo">Pular para o conteúdo</a>

<!-- Ícones (traço único, 1.6px) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="var(--azul)"/><g fill="var(--on-azul)"><rect x="8" y="7.5" width="3.6" height="17" rx="1"/><rect x="8" y="7.5" width="16.5" height="3.6" rx="1"/><rect x="8" y="14.2" width="12" height="3.6" rx="1"/><rect x="8" y="20.9" width="7.5" height="3.6" rx="1"/></g><rect x="18.5" y="20.9" width="3.6" height="3.6" rx="1.8" fill="var(--sinal)"/></symbol>
  <symbol id="i-turma" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9h18M8 4v16"/></symbol>
  <symbol id="i-alunos" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5"/><path d="M15.5 5.2a3 3 0 0 1 0 5.6M17.5 14.3c1.5.6 2.6 2.2 3 4.7"/></symbol>
  <symbol id="i-interv" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6v3H9z"/><path d="M8 5.5H5.5v15h13v-15H16"/><path d="m9 13 2 2 4-4.5"/></symbol>
  <symbol id="i-escola" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 5l9 5"/><path d="M5 10v9h14v-9"/><path d="M10 19v-5h4v5"/></symbol>
  <symbol id="i-modelo" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="M8 15l3.5-4 3 2.5L19 8"/></symbol>
  <symbol id="i-sim" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h9M18 6h1M5 12h3M12 12h7M5 18h11M20 18h-1"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="17.5" cy="18" r="1.5"/></symbol>
  <symbol id="i-config" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></symbol>
  <symbol id="i-baixar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 4.5 5-4.5M5 19.5h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>

<!-- ACESSO -->
<main class="login" id="login">
  <section class="login-form" aria-labelledby="login-titulo">
    <div class="login-caixa">
      <div class="marca"><svg class="marca-simbolo" aria-hidden="true"><use href="#logo"/></svg><span class="marca-nome">EduIA</span></div>
      <div class="login-cartao">
      <h1 id="login-titulo">Acesse sua conta</h1>
      <p class="lead">Entre com o e-mail da escola.</p>
      <form id="form-login" novalidate class="login-campos">
        <div class="campo">
          <label for="login-email">E-mail institucional</label>
          <input class="input" id="login-email" type="email" autocomplete="username" placeholder="nome@escola.ma.gov.br" required>
        </div>
        <div class="campo">
          <label for="login-senha">Senha</label>
          <input class="input" id="login-senha" type="password" autocomplete="current-password" required>
        </div>
        <p class="erro" id="login-erro" role="alert"></p>
        <button class="btn btn-primario btn-grande" type="submit">Entrar</button>
      </form>
      <div class="demo-acesso">
        <span>Contas de demonstração · senha 123456</span>
        <button type="button" data-demo="professor@eduia.com"><b>Professora</b><small>professor@eduia.com</small></button>
        <button type="button" data-demo="coordenador@eduia.com"><b>Coordenação</b><small>coordenador@eduia.com</small></button>
      </div>
      </div>
    </div>
    <p class="login-rodape">UNDB · Engenharia de Software · TCC 2026</p>
  </section>
</main>

<!-- APLICAÇÃO -->
<div class="app" id="app">
  <aside class="lateral" aria-label="Navegação principal">
    <div class="marca"><svg class="marca-simbolo" aria-hidden="true"><use href="#logo"/></svg><span class="marca-nome">EduIA</span></div>
    <div class="escola"><strong id="escola-nome"></strong><span id="escola-cidade"></span></div>
    <nav class="nav" id="nav">
      <span class="nav-grupo">Sala de aula</span>
      <a href="#turma" data-tela="turma"><svg><use href="#i-turma"/></svg>Turma</a>
      <a href="#alunos" data-tela="alunos"><svg><use href="#i-alunos"/></svg>Alunos</a>
      <a href="#intervencoes" data-tela="intervencoes"><svg><use href="#i-interv"/></svg>Intervenções<span class="contador" id="nav-pendentes" hidden></span></a>
      <span class="nav-grupo">Coordenação</span>
      <a href="#escola" data-tela="escola"><svg><use href="#i-escola"/></svg>Escola</a>
      <a href="#modelo" data-tela="modelo"><svg><use href="#i-modelo"/></svg>Como o risco é calculado</a>
      <a href="#simulador" data-tela="simulador"><svg><use href="#i-sim"/></svg>Simulador</a>
      <a href="#config" data-tela="config"><svg><use href="#i-config"/></svg>Configurações</a>
    </nav>
    <div class="lateral-rodape">
      <div class="usuario"><strong id="usuario-nome"></strong><span id="usuario-perfil"></span></div>
      <div class="linha"><span class="modelo-info" id="modelo-info"></span><button class="btn btn-texto" id="btn-sair" type="button">Sair</button></div>
    </div>
  </aside>

  <div class="principal">
    <header class="cabecalho">
      <div><h1 id="titulo" tabindex="-1"></h1><p class="sub" id="subtitulo"></p></div>
      <div id="cabecalho-extra"></div>
    </header>
    <main class="conteudo" id="conteudo">
      <section class="tela" id="tela-turma"></section>
      <section class="tela" id="tela-alunos"></section>
      <section class="tela" id="tela-intervencoes"></section>
      <section class="tela" id="tela-escola"></section>
      <section class="tela" id="tela-modelo"></section>
      <section class="tela" id="tela-simulador"></section>
      <section class="tela" id="tela-config"></section>
    </main>
  </div>
</div>

<dialog id="dialogo" aria-labelledby="dlg-titulo">
  <div class="dlg-topo">
    <div><h2 id="dlg-titulo"></h2><p id="dlg-sub"></p></div>
    <button class="fechar" type="button" data-fechar aria-label="Fechar"><svg width="18" height="18"><use href="#i-x"/></svg></button>
  </div>
  <div class="dlg-corpo" id="dlg-corpo"></div>
  <div class="dlg-acoes" id="dlg-acoes"></div>
</dialog>

<div class="aviso-toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/chart.umd.min.js"></script>
<script src="js/dados-modelo.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/dados.js"></script>
<script src="js/auth.js"></script>
<script src="js/ficha.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/alunos.js"></script>
<script src="js/intervencoes.js"></script>
<script src="js/relatorios.js"></script>
<script src="js/modelo.js"></script>
<script src="js/simulador.js"></script>
<script src="js/navegacao.js"></script>
<script src="js/main.js"></script>
</body>
</html>
